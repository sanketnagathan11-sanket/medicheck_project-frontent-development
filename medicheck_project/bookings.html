<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediCheck — My Bookings</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body id="page-bookings">

  <div class="wrap" style="padding-top:2.5rem">
    <div class="section-head">
      <div>
        <h1 class="section-title">Patient Portal &amp; Bookings Lookup</h1>
        <p class="section-sub">Search your bookings by phone number to check live report status.</p>
      </div>
    </div>
    <div id="lookup-container" style="background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:1.5rem;margin-bottom:2.5rem;max-width:620px;box-shadow:0 1px 3px rgba(0,0,0,.05)">
      <div style="display:flex;gap:.75rem">
        <input id="lookup-phone" type="tel" placeholder="Enter 10-digit registered phone number" style="flex:1">
        <button class="btn btn-primary" onclick="lookupBookings()">Find My Bookings</button>
      </div>
    </div>
    <div id="patient-info"></div>
    <div id="bookings-results"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

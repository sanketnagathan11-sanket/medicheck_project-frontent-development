<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediCheck — Tests & Packages</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body id="page-tests">
  
  <div class="wrap" style="padding-top:2.5rem">
    <div class="section-head">
      <div>
        <h1 class="section-title">Diagnostic Tests &amp; Packages</h1>
        <p class="section-sub">Browse individual diagnostic tests or multi-parameter checkup packages.</p>
      </div>
      <button class="btn btn-primary" onclick="showPage('book')">Book a Test &rarr;</button>
    </div>
    <div class="filter-bar">
      <div class="filter-bar-inner">
        <div style="display:flex;gap:.5rem;flex:1;min-width:260px">
          <input type="text" id="test-search" placeholder="Search tests…" oninput="renderTests()" style="flex:1">
        </div>
        <div class="cat-btns" id="cat-btns"></div>
      </div>
    </div>
    <div id="tests-packages" style="margin-bottom:3rem"></div>
    <h2 style="font-size:1.4rem;margin-bottom:1.1rem">🧪 Available Lab Tests</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Test Name</th><th>Category</th><th>Sample</th><th>Turnaround</th><th>Price</th><th>Action</th></tr></thead>
        <tbody id="tests-table"></tbody>
      </table>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

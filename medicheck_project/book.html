<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediCheck — Book a Test</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body id="page-book">
  
  <div class="wrap" style="padding-top:2.5rem;max-width:900px">
    <div style="text-align:center;margin-bottom:2.5rem">
      <h1 class="section-title">Schedule Your Lab Appointment</h1>
      <p class="section-sub">Select tests or packages, choose your service tier, and pick a time slot.</p>
    </div>
    <div class="form-card">
      <h3 style="font-size:1.15rem;margin-bottom:1.2rem;color:var(--primary-dark);border-bottom:2px solid var(--primary-light);padding-bottom:.5rem">1. Patient Details</h3>
      <div class="form-grid" style="margin-bottom:2rem">
        <div class="fg"><label>Full Name *</label><input id="b-name" placeholder="e.g. Anjali Sharma"></div>
        <div class="fg"><label>Phone (Unique ID) *</label><input id="b-phone" type="tel" placeholder="10-digit mobile number"></div>
        <div class="fg"><label>Email Address</label><input id="b-email" type="email" placeholder="patient@example.com"></div>
        <div class="fg"><label>Date of Birth *</label><input id="b-dob" type="date"></div>
        <div class="fg"><label>Gender *</label><select id="b-gender"><option>Male</option><option>Female</option><option>Other</option></select></div>
        <div class="fg"><label>Blood Group</label><select id="b-bloodgroup"><option value="">Select</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>O+</option><option>O-</option><option>AB+</option><option>AB-</option></select></div>
        <div class="fg"><label>Service Tier *</label><select id="b-tier" onchange="calcTotal()"><option value="Mass">Mass Tier (Standard Walk-in)</option><option value="Premium">Premium Tier (Home Collection VIP)</option></select></div>
        <div class="fg full"><label>Full Address (Required for Home Collection)</label><input id="b-address" placeholder="Street, landmark, city, postal code"></div>
      </div>
      <h3 style="font-size:1.15rem;margin-bottom:1.2rem;color:var(--primary-dark);border-bottom:2px solid var(--primary-light);padding-bottom:.5rem">2. Select Tests or Package</h3>
      <div class="fg" style="margin-bottom:1.5rem">
        <label>Select Health Package (Optional)</label>
        <select id="b-package" onchange="calcTotal()">
          <option value="">-- None (Choose Individual Tests Below) --</option>
        </select>
      </div>
      <div class="fg" style="margin-bottom:2rem">
        <label>Select Individual Tests</label>
        <div class="tests-grid" id="book-tests-grid"></div>
      </div>
      <h3 style="font-size:1.15rem;margin-bottom:1.2rem;color:var(--primary-dark);border-bottom:2px solid var(--primary-light);padding-bottom:.5rem">3. Scheduling &amp; Payment</h3>
      <div class="form-grid" style="margin-bottom:2rem">
        <div class="fg"><label>Booking Type *</label><select id="b-type" onchange="calcTotal()"><option value="Walk-in">Walk-in Appointment</option><option value="Home Collection">Home Sample Collection (+₹150 for Mass tier)</option></select></div>
        <div class="fg"><label>Appointment Date *</label><input id="b-date" type="date" onchange="updateSlots()"></div>
        <div class="fg"><label>Preferred Time Slot *</label><select id="b-slot"></select></div>
        <div class="fg"><label>Payment Method *</label><select id="b-pay"><option value="UPI">UPI (Google Pay / PhonePe)</option><option value="Card">Credit / Debit Card</option><option value="Cash">Cash on Collection</option><option value="Online">Net Banking</option></select></div>
      </div>
      <div style="background:var(--primary-light);padding:1.2rem 1.5rem;border-radius:var(--r);display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem">
        <div><div style="font-weight:700;color:var(--primary-dark)">Estimated Total Amount</div><div id="total-note" style="font-size:.83rem;color:var(--muted)">Standard processing included.</div></div>
        <div id="total-display" style="font-family:var(--font-h);font-size:2rem;font-weight:800;color:var(--primary-dark)">₹0.00</div>
      </div>
      <button class="btn btn-primary" style="width:100%;font-size:1.1rem;padding:.9rem" onclick="submitBooking()">Confirm Booking &amp; Schedule Appointment →</button>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
